<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </linearGradient>
    <style>
      .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 46px; fill: #ffffff; }
      .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #cbd5e1; }
      .tag { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 13px; fill: #818cf8; }
      
      @keyframes floatChart {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
        100% { transform: translateY(0px); }
      }
      @keyframes pulseLine {
        0% { stroke-dashoffset: 600; }
        50% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -600; }
      }
      @keyframes floatCard {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-6px) rotate(1deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      
      .animated-chart { animation: floatChart 6s ease-in-out infinite; }
      .animated-line { stroke-dasharray: 600; animation: pulseLine 8s linear infinite; }
      .animated-card { animation: floatCard 5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="320" rx="16" fill="none" stroke="#334155" stroke-width="2" />

  <!-- Background Dynamic Graphic Elements (Behind Foreground Text) -->
  <g opacity="0.25">
    <!-- Grid Lines -->
    <path d="M 0,80 L 1200,80 M 0,160 L 1200,160 M 0,240 L 1200,240" stroke="#475569" stroke-width="1" stroke-dasharray="4 4" />
    <path d="M 200,0 L 200,320 M 400,0 L 400,320 M 600,0 L 600,320 M 800,0 L 800,320 M 1000,0 L 1000,320" stroke="#475569" stroke-width="1" stroke-dasharray="4 4" />
  </g>

  <!-- Right Side Visualizations (Background Dynamic Elements) -->
  <g transform="translate(750, 40)" class="animated-chart">
    <!-- Chart Background Glass Card -->
    <rect width="380" height="240" rx="12" fill="#1e293b" opacity="0.7" stroke="#475569" stroke-width="1.5" />
    
    <!-- Area Chart Fill -->
    <path d="M 30,180 L 80,140 L 140,160 L 200,90 L 260,110 L 330,40 L 330,200 L 30,200 Z" fill="url(#glowGrad)" />
    
    <!-- Animated Line Chart -->
    <path class="animated-line" d="M 30,180 L 80,140 L 140,160 L 200,90 L 260,110 L 330,40" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Data Nodes -->
    <circle cx="80" cy="140" r="5" fill="#6366f1" />
    <circle cx="140" cy="160" r="5" fill="#a855f7" />
    <circle cx="200" cy="90" r="5" fill="#ec4899" />
    <circle cx="260" cy="110" r="5" fill="#6366f1" />
    <circle cx="330" cy="40" r="6" fill="#10b981" />

    <!-- AI Analytics Pill Overlay -->
    <g transform="translate(180, 130)" class="animated-card">
      <rect width="170" height="55" rx="8" fill="#0f172a" stroke="#6366f1" stroke-width="1.5" />
      <text x="15" y="24" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#a855f7">🤖 AI ACCRUAL ENGINE</text>
      <text x="15" y="42" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#10b981">⚡ 99.4% Auto-Match</text>
    </g>
  </g>

  <!-- Foreground Content (Text & Title - Guaranteed Unobscured) -->
  <g transform="translate(60, 0)">
    <!-- Decorative Accent Bar -->
    <rect x="0" y="72" width="6" height="175" rx="3" fill="url(#accentGrad)" />

    <!-- Category Pill -->
    <g transform="translate(24, 72)">
      <rect width="320" height="28" rx="14" fill="#312e81" stroke="#4f46e5" stroke-width="1" />
      <text x="14" y="19" class="tag">💡 CURATED AI &amp; FINTECH DIRECTORY • 2026</text>
    </g>

    <!-- Main Title -->
    <text x="24" y="145" class="title">Awesome AI Finance Assistant</text>

    <!-- Subtitle -->
    <text x="24" y="185" class="subtitle">Conversational Accounting, AI-Native ERPs &amp; Close Automation</text>

    <!-- Feature Pills -->
    <g transform="translate(24, 215)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="130" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="14" y="20" font-family="Segoe UI, sans-serif" font-size="12" fill="#38bdf8" font-weight="600">📊 SaaS Pricing</text>

      <!-- Pill 2 -->
      <rect x="142" y="0" width="155" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="156" y="20" font-family="Segoe UI, sans-serif" font-size="12" fill="#34d399" font-weight="600">⚡ Star Benchmarks</text>

      <!-- Pill 3 -->
      <rect x="309" y="0" width="165" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="323" y="20" font-family="Segoe UI, sans-serif" font-size="12" fill="#f472b6" font-weight="600">🤖 Open-Source ERPs</text>
    </g>
  </g>
</svg>
